<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="200" viewBox="0 0 1280 200" role="img"
     aria-label="Tools that make a codebase walkable — one spec, two consumers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#1c2128"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3d444d"/>
    </marker>
  </defs>

  <rect width="1280" height="200" fill="url(#bg)"/>
  <rect width="1280" height="4" fill="url(#thread)"/>

  <!-- 左：一句陈述 -->
  <text x="64" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="700" letter-spacing="-0.8"
        fill="#e6edf3">Tools that make a codebase walkable.</text>
  <text x="64" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#adbac7">call-chain walkthroughs · agent plugins · upstream fixes</text>

  <!-- 右：一份 spec → 两个消费端 -->
  <g>
    <rect x="852" y="77" width="128" height="46" rx="6" fill="#0d1117" stroke="#3d444d"/>
    <text x="916" y="106" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#e6edf3">spec.json</text>

    <path d="M980 100 H 1010" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#arrow)" opacity="0"/>
    <path d="M980 100 H 1012" stroke="#3d444d" stroke-width="2" fill="none"/>
    <path d="M1012 57 V 143" stroke="#3d444d" stroke-width="2" fill="none"/>
    <path d="M1012 57 H 1028" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M1012 143 H 1028" stroke="#3d444d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <rect x="1032" y="34" width="184" height="46" rx="6" fill="#0d1117" stroke="#58a6ff"/>
    <text x="1124" y="63" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#e6edf3">Neovim walkthrough</text>

    <rect x="1032" y="120" width="184" height="46" rx="6" fill="#0d1117" stroke="#58a6ff"/>
    <text x="1124" y="149" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#e6edf3">HTML code map</text>
  </g>
</svg>
