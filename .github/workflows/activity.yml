name: activity

on:
  schedule:
    - cron: "17 3 * * *"   # 每天 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats (GraphQL, 单次请求)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql -f query='
          query($login: String!) {
            user(login: $login) {
              repositories(privacy: PUBLIC, ownerAffiliations: OWNER) { totalCount }
              pullRequests(states: MERGED) { totalCount }
              contributionsCollection { totalCommitContributions contributionCalendar { totalContributions } }
            }
          }' -f login="$LOGIN" > stats.json

      - name: Render SVG (light + dark)
        run: python3 scripts/render_stats.py stats.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-light.svg assets/activity-dark.svg
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh activity stats"
            git push
          fi
